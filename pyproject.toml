[project]
name = "geo-device"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "psycopg>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]


[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.15.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "C", "N", "I", "B", "Q", "T", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]
"generator.py" = ["T201"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
packages = ["app"]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers"
markers = [
    "unit: pure-function tests, no infrastructure (database, network, filesystem)",
    "integration: tests that exercise the real database and infrastructure",
    "e2e: end-to-end tests that drive the FastAPI app via HTTP",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]
omit = [
    "migrations/*",
    "app/core/*",
    "app/main.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
